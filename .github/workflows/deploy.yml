name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要写入权限以推送到 gh-pages 分支
permissions:
  contents: write

# 同一时间只保留一次部署，避免并发覆盖
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # 注：本项目存在 esbuild 双版本（vite 用 0.25 / lightningcss+tsx 用 0.28），
        # pnpm 在 Windows/Linux 下对其 postinstall 的版本自检会误报非零退出码，
        # 但实际二进制已就位、构建正常。此处容忍该误报，让后续 build 继续执行。
        run: pnpm install || echo "::warning::pnpm install exited non-zero (known esbuild dual-version postinstall quirk); node_modules is still usable."

      - name: Build
        run: pnpm build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.sha }}"
